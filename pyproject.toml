[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-breed-mlops"
version = "0.1.0"
description = "End-to-end MLOps platform for pet breed classification using the Oxford-IIIT Pet dataset."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Salma Ahmed" }
]

dependencies = [
    "numpy>=2.0,<3.0",
    "pillow>=10.0,<12.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "torch>=2.4,<3.0",
    "torchvision>=0.19,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "dvc>=3.50,<4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true